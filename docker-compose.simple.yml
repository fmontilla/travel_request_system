version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: travel_request_db_simple
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: travel_request
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_simple_data:/var/lib/mysql

volumes:
  db_simple_data:
    driver: local
