services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_request_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - travel_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    platform: linux/arm64
    container_name: travel_request_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - travel_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    platform: linux/arm64
    container_name: travel_request_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-travel_request}
      MYSQL_USER: ${DB_USERNAME:-travel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - travel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret", "--silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  travel_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
